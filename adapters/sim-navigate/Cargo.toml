[package]
name = "sim-navigate"
description = "Bridges Simulate's master clock and visual harness into Navigate's real visual-fix admission and navigation filter"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sim-geo = { workspace = true }
sim-core = { workspace = true }
sim-spacetime = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
nalgebra = { workspace = true }
pollster = { workspace = true }
navigate-camera = { workspace = true }
navigate-celestial = { workspace = true }
navigate-contract = { workspace = true }
navigate-data = { workspace = true }
navigate-fusion = { workspace = true }
navigate-geodesy = { workspace = true }
navigate-guidance = { workspace = true }
navigate-onboard = { workspace = true, features = ["terrain-camera"] }
navigate-route = { workspace = true }
navigate-startrack = { workspace = true }
navigate-visual = { workspace = true }
sim-render = { workspace = true }
sim-scenario = { workspace = true }
sim-scenery = { workspace = true }
sim-atmosphere = { workspace = true }
sim-devices = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }

# Resident memory of the host process, for compute metering; the browser build
# has no process to read.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memory-stats = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
sim-orbital = { workspace = true }
tracing-subscriber = { workspace = true }
