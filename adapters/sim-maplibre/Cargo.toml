[package]
name = "sim-maplibre"
description = "Shared-GPU maplibre-rs adapter isolating Truth OTW/sensor scenes from Belief avionics/volumetric underlays"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
