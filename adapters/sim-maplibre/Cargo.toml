cgmath = { workspace = true }
flightbag = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
indicate-alerts = { workspace = true }
indicate-instrument-descriptor = { workspace = true }
indicate-instrument-scene = { workspace = true }
indicate-instrument-state = { workspace = true }
indicate-instrument-volumes = { workspace = true }
indicate-interaction = { workspace = true }
maplibre = { workspace = true }
mbd-core = { workspace = true }
openusd = { workspace = true }
openusd-schemas = { workspace = true }
serde_json = { workspace = true }
sim-core = { workspace = true }
sim-geo = { workspace = true }
sim-indicate = { workspace = true }
sim-p38g = { workspace = true }
sim-pack = { workspace = true }
sim-scenery = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }
wgpu = { workspace = true }
world = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maplibre = { workspace = true, features = ["thread-safe-futures"] }
tokio = { workspace = true }

[dev-dependencies]
indicate-frames = { workspace = true }
pollster = { workspace = true }
