<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Simulate</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #02020a; overflow: hidden; overscroll-behavior: none; touch-action: none; }
      canvas { display: block; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; outline: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      /* The progress surface: boot.mjs drives it while the simulator downloads,
         then the app drives the same elements until it has something to draw. */
      #boot {
        position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
        overflow: auto; background: #02020a; color: #d7dbe6;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot[data-state="done"] { display: none; }
      #boot-card { width: min(34rem, calc(100vw - 3rem)); padding: 2rem 0; }
      #boot[data-state="plan"] #boot-card, #boot[data-state="refused"] #boot-card { width: min(52rem, calc(100vw - 3rem)); }
      #boot h1 { margin: 0 0 1.2rem; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8f98ad; }
      #boot-phase, .section h2 { margin: 0 0 0.6rem; font-size: 1.05rem; font-weight: 400; color: #f2f4f8; }
      .bar { height: 6px; border-radius: 3px; background: #1b2030; overflow: hidden; }
      .fill { height: 100%; width: 0; border-radius: 3px; background: #5aa2ff; transition: width 120ms linear; }
      .bar[data-unknown] .fill { width: 30%; animation: boot-sweep 1.4s ease-in-out infinite; }
      @keyframes boot-sweep { from { margin-left: -30%; } to { margin-left: 100%; } }
      .detail { margin: 0.6rem 0 0; min-height: 1.5em; color: #8f98ad; font-variant-numeric: tabular-nums; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
      /* Live status: a fixed number of short lines, each cut rather than wrapped, so a block
         never changes height while it updates. */
      .live { margin: 0.6rem 0 0; color: #8f98ad; font-variant-numeric: tabular-nums; user-select: text; }
      .live-line { min-height: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lines.live-rows { grid-template-columns: max-content minmax(0, 1fr); }
      .lines.live-rows dt, .lines.live-rows dd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .detail.run-link { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #boot[data-state="failed"] #boot-bar, #boot[data-state="plan"] #boot-bar, #boot[data-state="refused"] #boot-bar { display: none; }
      #boot[data-state="failed"] #boot-phase, #boot[data-state="refused"] #boot-phase { color: #ff8a80; }
      /* Labelled lines the app writes: the plan of a link, or why it is refused. */
      .lines { display: grid; grid-template-columns: max-content 1fr; gap: 0.3rem 1.2rem; margin: 1rem 0 0; }
      .lines:empty { display: none; }
      .lines dt { color: #8f98ad; }
      .lines dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; font-variant-numeric: tabular-nums; }
      #boot[data-state="refused"] #boot-lines dd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
      /* Sections the app adds under the plan: the map package, the flight. */
      .section { margin-top: 1.6rem; padding-top: 1.4rem; border-top: 1px solid #1b2030; }
      .section[data-state="refused"] h2 { color: #ff8a80; }
      .section [hidden] { display: none; }
      .section button { margin-top: 1rem; padding: 0.5rem 1.1rem; border: 1px solid #5aa2ff; border-radius: 4px; background: #10203a; color: #f2f4f8; font: inherit; cursor: pointer; }
      .section button:hover { background: #17305a; }
      /* The flight monitor: its plot, the sets' legend and the pace. */
      .plot { display: block; width: 100%; height: 260px; margin-top: 1rem; }
      /* The world view with the PFD and HSI beside it on a wide page, under it on a narrow one;
         the card widens while it flies so the window view keeps its size. */
      #boot[data-state] #boot-card:has(.world-row) { width: min(84rem, calc(100vw - 2rem)); }
      .world-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, 23rem); gap: 0.8rem; margin-top: 1rem; align-items: start; }
      .world-view { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 4px; background: #0b0e17; }
      .instrument-panels { display: flex; flex-direction: column; gap: 0.8rem; min-width: 0; }
      .instrument-panel { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 4px; background: #000; }
      @media (max-width: 56rem) {
        .world-row { grid-template-columns: minmax(0, 1fr); }
        .instrument-panels { flex-direction: row; }
        .instrument-panels .instrument-panel { flex: 1 1 0; width: auto; min-width: 0; }
      }
      /* The page's map: the app's EFB map on its own canvas, with fix labels, buttons and the picked fix's card laid over it. */
      .page-map-frame { position: relative; margin-top: 1rem; overflow: hidden; border-radius: 4px; }
      .page-map { display: block; width: 100%; height: auto; aspect-ratio: 1 / 0.62; background: #0b0e17; touch-action: none; cursor: grab; }
      .page-map:active { cursor: grabbing; }
      .page-map-labels { position: absolute; inset: 0; pointer-events: none; }
      .fix-label { position: absolute; transform: translate(8px, -130%); font: 600 12px/1 system-ui, sans-serif; color: #ffffff; text-shadow: 0 0 3px #05070b, 0 0 3px #05070b; white-space: nowrap; }
      .fix-label.active { color: #ff40ff; }
      .truth-label { position: absolute; transform: translate(14px, 6px); font: 600 12px/1 system-ui, sans-serif; color: #ffe066; text-shadow: 0 0 3px #05070b, 0 0 3px #05070b; white-space: nowrap; pointer-events: none; }
      .series.groundtruth { cursor: default; padding-left: 1.6rem; }
      .fix-label.flown { color: #9aa1b2; }
      .page-map-card { position: absolute; transform: translate(-50%, 14px); min-width: 11rem; padding: 0.5rem 0.7rem; border: 1px solid #2b3245; border-radius: 6px; background: rgba(11, 14, 23, 0.94); font-size: 13px; line-height: 1.45; font-variant-numeric: tabular-nums; pointer-events: none; }
      .page-map-card .ident { font-weight: 600; color: #f2f4f8; }
      .page-map-buttons { position: absolute; top: 0.5rem; left: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: flex-start; max-width: calc(100% - 4.5rem); }
      .section .page-map-buttons button { margin: 0; padding: 0.3rem 0.6rem; min-width: 2.2rem; border-color: #2b3245; background: rgba(11, 14, 23, 0.85); font-size: 13px; }
      .section .page-map-buttons button:disabled { opacity: 0.4; cursor: default; }
      .track-map { display: block; width: 100%; height: auto; margin-top: 1rem; border-radius: 4px; }
      .frame-panel { display: flex; flex-wrap: wrap; gap: 1rem 1.2rem; margin-top: 1rem; align-items: flex-start; }
      .frame-panel > div { flex: 1 1 14rem; min-width: 0; }
      .frame-panel .detail { margin-top: 0; }
      .match-panel { margin-top: 1rem; }
      .match { display: block; max-width: 100%; height: auto; border-radius: 4px; background: #0b0e17; }
      .frame { display: block; width: 400px; max-width: 100%; height: auto; border-radius: 4px; background: #0b0e17; }
      .legend, .sensor-rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.3rem 1.2rem; margin-top: 1rem; align-items: center; }
      .role { padding: 0.05rem 0.45rem; border: 1px solid #2b3245; border-radius: 999px; color: #8f98ad; font-size: 12px; white-space: nowrap; }
      /* Whose navigation the flight is flown on. */
      .steering { margin-top: 1rem; padding: 0.7rem 0.9rem; border: 1px solid #2b3245; border-radius: 6px; background: #0b0e17; }
      .steering .detail { margin-top: 0.35rem; }
      .steering-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0; font-size: 1.05rem; color: #f2f4f8; }
      .steering-head .swatch { width: 22px; height: 6px; }
      .steering-others a { margin-right: 0.8rem; color: #5aa2ff; }
      /* The sensors' fault switches: each a checkbox drawn as a button, with what its sensor's consumers report beside it. */
      .sensor-controls { margin-top: 1rem; }
      .sensor-controls > .detail { margin: 0; }
      .sensor-rows { margin-top: 0.5rem; gap: 0.4rem 1rem; }
      .fault-switch { display: inline-flex; gap: 0.45rem; align-items: center; min-width: 8.5rem; padding: 0.4rem 0.8rem; border: 1px solid #2b3245; border-radius: 4px; background: #10203a; color: #f2f4f8; cursor: pointer; user-select: none; }
      .fault-switch:hover { background: #17305a; }
      .fault-switch:has(input:checked) { border-color: #ffb454; background: #3a2a10; color: #ffd9a0; }
      .fault-switch:has(input:disabled) { opacity: 0.5; cursor: default; }
      .section .fault-switch input { accent-color: #ffb454; }
      .sensor-rows .value { white-space: normal; overflow: visible; }
      .sensor-rows .value.active { color: #ffd9a0; }
      .gnss-checks { margin-top: 0.6rem; }
      .gnss-checks.alert dd { color: #ffd9a0; }
      @media (max-width: 40rem) { .sensor-rows { grid-template-columns: minmax(0, 1fr); } }
      .series { display: flex; gap: 0.5rem; align-items: center; cursor: pointer; }
      .swatch { display: inline-block; width: 16px; height: 4px; border-radius: 2px; }
      .value { min-width: 0; color: #8f98ad; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .speeds { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; margin-top: 1rem; color: #8f98ad; }
      .speeds label { display: flex; gap: 0.3rem; align-items: center; color: #d7dbe6; cursor: pointer; }
      .section input { accent-color: #5aa2ff; }
      .efb-web-drawer { margin-top: 0.7rem; padding: 0.85rem; border: 1px solid #2b3245; border-radius: 6px; background: #0b0e17; }
      .efb-web-omni, .efb-web-chips, .efb-web-actions, .efb-web-presets { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.55rem; align-items: center; }
      .efb-web-omni { margin-top: 0; }
      .efb-web-input { flex: 1 1 18rem; min-width: 0; padding: 0.42rem 0.65rem; border: 1px solid #2b3245; border-radius: 4px; background: #06080f; color: #f2f4f8; font: inherit; }
      .section .efb-web-btn, .section .efb-web-chip { margin-top: 0; padding: 0.34rem 0.7rem; border-radius: 4px; font-size: 13px; }
      .section .efb-web-btn.primary { border-color: #5aa2ff; background: #163059; }
      .section .efb-web-btn.emerald, .section .efb-web-chip.adhoc { border-color: #34d399; background: #0e2e26; color: #a7f3d0; }
      .section .efb-web-chip { border-color: #2b3245; background: #121826; border-radius: 999px; }
      .section .efb-web-chip.hold { border-color: #ffb454; color: #ffd9a0; }
      .section .efb-web-chip.selected { border-color: #5aa2ff; box-shadow: 0 0 0 1px #5aa2ff; }
      @media (pointer: coarse) {
        :where(.tc-btn, .tc-dial-btn, .tc-more-btn, .tc-rotate-close, .page-map-buttons button, .section button) {
          min-block-size: 44px; min-inline-size: 44px;
        }
      }
      #touch-cockpit {
        position: fixed; inset: 0; z-index: 5; pointer-events: none;
        touch-action: none; user-select: none; -webkit-user-select: none;
        display: flex; flex-direction: column; justify-content: space-between;
        padding:
          max(0.5rem, env(safe-area-inset-top, 0px))
          max(0.5rem, env(safe-area-inset-right, 0px))
          max(0.65rem, env(safe-area-inset-bottom, 0px))
          max(0.5rem, env(safe-area-inset-left, 0px));
        font: 600 12px/1 system-ui, -apple-system, sans-serif; color: #eef3ff;
      }
      .tc-safe-probe {
        position: absolute; visibility: hidden; pointer-events: none; width: 0; height: 0;
        padding:
          env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      .tc-top-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; min-width: 0; }
      /* The bar ends left of the corner map and, beside the instrument column, right of
         its fold tab; the wrap right-aligns it, and a bar wider than that room scrolls. */
      #touch-cockpit[data-has-map="true"] .tc-top-wrap {
        margin-right: max(0px, calc((1 - var(--tc-map-left, 1)) * 100vw + 6px - max(0.5rem, env(safe-area-inset-right, 0px))));
      }
      @media (orientation: landscape) {
        #touch-cockpit[data-has-rail="true"] .tc-top-wrap {
          margin-left: max(0px, calc(var(--tc-efis-left, 0) * 100vw + 50px - max(0.5rem, env(safe-area-inset-left, 0px))));
        }
      }
      .tc-top {
        display: flex; flex-wrap: nowrap; gap: 0.4rem; align-items: center;
        max-width: 100%; overflow-x: auto; overscroll-behavior: contain; scrollbar-width: none;
      }
      .tc-top::-webkit-scrollbar { display: none; }
      .tc-top .tc-btn { touch-action: pan-x; }
      @media (max-width: 720px) {
        .tc-top { gap: 0.25rem; }
        .tc-top .tc-btn { padding: 0 0.4rem; }
      }
      .tc-btn {
        pointer-events: auto; touch-action: none; min-width: 44px; min-height: 44px; flex-shrink: 0;
        padding: 0 0.7rem; border: 1px solid rgba(155, 185, 235, 0.38); border-radius: 10px;
        background: rgba(9, 14, 26, 0.62); color: #eef3ff; font: inherit; white-space: nowrap;
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      }
      .tc-btn[data-active="true"], .tc-dial-btn[data-active="true"], .tc-more-btn[data-active="true"] {
        border-color: #5aa2ff; background: rgba(24, 62, 118, 0.82); color: #ffffff;
      }
      .tc-collapsed-only { display: none; }
      #touch-cockpit[data-collapsed="true"] .tc-collapsed-only {
        display: inline-flex; align-items: center; justify-content: center;
      }
      /* Fold tabs sit on the edges the window reports for what they fold, as fractions of
         the canvas, so they are placed in the canvas's own units. */
      .tc-tab {
        position: absolute; display: none; align-items: center; justify-content: center;
        width: 44px; height: 44px; padding: 0; font-size: 16px;
      }
      #touch-cockpit[data-has-rail="true"] .tc-rail-fold {
        display: inline-flex; border-left: 0; border-radius: 0 10px 10px 0;
        left: calc(var(--tc-efis-left, 0) * 100vw); top: calc(var(--tc-rail-top, 0) * 100vh);
        left: calc(var(--tc-efis-left, 0) * 100dvw); top: calc(var(--tc-rail-top, 0) * 100dvh);
      }
      #touch-cockpit[data-rail-folded="true"] .tc-rail-unfold {
        display: inline-flex; width: auto; padding: 0 0.6rem; font-size: 12px;
        left: calc(var(--tc-rail-left, 0) * 100vw); top: calc(var(--tc-rail-top, 0) * 100vh);
        left: calc(var(--tc-rail-left, 0) * 100dvw); top: calc(var(--tc-rail-top, 0) * 100dvh);
      }
      #touch-cockpit[data-has-map="true"] .tc-map-fold {
        display: inline-flex; border-radius: 0 10px 0 0;
        left: calc(var(--tc-map-left, 1) * 100vw); top: calc(var(--tc-map-bottom, 0) * 100vh - 44px);
        left: calc(var(--tc-map-left, 1) * 100dvw); top: calc(var(--tc-map-bottom, 0) * 100dvh - 44px);
      }
      .tc-brake[data-active="true"] { border-color: #ffb454; background: rgba(92, 56, 12, 0.82); color: #ffd9a0; }
      #tc-rotate-banner {
        display: none; pointer-events: auto; align-items: center; justify-content: space-between; gap: 0.5rem;
        width: 100%; max-width: min(26rem, 100%); padding: 0.25rem 0.5rem 0.25rem 0.75rem;
        border: 1px solid rgba(90, 162, 255, 0.45); border-radius: 10px;
        background: rgba(9, 14, 26, 0.84); color: #d8e6ff; font: 500 12px/1.25 system-ui, -apple-system, sans-serif;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      }
      .tc-rotate-close {
        border: 0; border-radius: 8px; background: transparent; color: #eef3ff;
        font: 600 16px/1 system-ui, sans-serif; padding: 0 0.4rem; cursor: pointer;
      }
      .tc-popover {
        pointer-events: auto; touch-action: manipulation;
        width: min(21rem, calc(100vw - 1rem - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
        max-height: calc(100dvh - 4.5rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        overflow-y: auto; overscroll-behavior: contain; padding: 0.65rem;
        border: 1px solid rgba(155, 185, 235, 0.42); border-radius: 12px;
        background: rgba(9, 14, 26, 0.90); color: #eef3ff;
        font: 600 12px/1.2 system-ui, -apple-system, sans-serif;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      }
      .tc-popover::backdrop { background: rgba(2, 4, 10, 0.28); }
      @supports (position-area: block-end) {
        .tc-anchor-dial { anchor-name: --tc-dial; }
        .tc-anchor-more { anchor-name: --tc-more; }
        .tc-popover { position: fixed; inset: auto; margin: 0; }
        #tc-dial-popover {
          position-anchor: --tc-dial; position-area: block-end span-inline-start;
          position-try-fallbacks: flip-inline, flip-block; margin-block-start: 0.4rem;
        }
        #tc-more-popover {
          position-anchor: --tc-more; position-area: block-end span-inline-start;
          position-try-fallbacks: flip-inline, flip-block; margin-block-start: 0.4rem;
        }
      }
      @supports not (position-area: block-end) {
        .tc-popover {
          position: fixed; inset: auto; margin: 0;
          top: calc(max(0.5rem, env(safe-area-inset-top, 0px)) + 52px);
          right: max(0.5rem, env(safe-area-inset-right, 0px));
        }
      }
      .tc-dial-summary {
        margin-bottom: 0.35rem; padding-bottom: 0.25rem; border-bottom: 1px solid rgba(155, 185, 235, 0.2);
        font: 600 12px/1.3 ui-monospace, Menlo, monospace; color: #a9c7ff; font-variant-numeric: tabular-nums;
      }
      .tc-dial-group + .tc-dial-group { margin-top: 0.35rem; padding-top: 0.35rem; border-top: 1px solid rgba(155, 185, 235, 0.14); }
      .tc-dial-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem; color: #9db2d8; }
      .tc-dial-val { color: #eef3ff; font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; }
      .tc-dial-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.3rem; }
      .tc-dial-row.baro { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tc-dial-btn, .tc-more-btn {
        min-height: 44px; padding: 0 0.4rem; border: 1px solid rgba(155, 185, 235, 0.34);
        border-radius: 8px; background: rgba(16, 26, 48, 0.78); color: #eef3ff; font: inherit; cursor: pointer;
      }
      .tc-scrub {
        margin-top: 0.35rem; height: 44px; border-radius: 8px; touch-action: none;
        border: 1px dashed rgba(143, 192, 255, 0.42);
        background: repeating-linear-gradient(90deg, rgba(90, 162, 255, 0.16) 0 2px, transparent 2px 14px), rgba(9, 14, 26, 0.7);
        display: grid; place-items: center; color: #9db2d8; font-size: 11px; letter-spacing: 0.05em;
      }
      .tc-more-section + .tc-more-section { margin-top: 0.55rem; padding-top: 0.5rem; border-top: 1px solid rgba(155, 185, 235, 0.16); }
      .tc-more-label { margin-bottom: 0.35rem; color: #8fa4ca; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
      .tc-more-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.35rem; }
      .tc-more-grid.views { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .tc-deck {
        display: flex; align-items: flex-end; justify-content: space-between; gap: 0.75rem;
        transition: opacity 260ms ease;
      }
      @media (orientation: landscape) {
        #touch-cockpit[data-has-rail="true"] .tc-deck {
          padding-left: max(0px, calc(var(--tc-efis-left, 0) * 100vw + 6px - max(0.5rem, env(safe-area-inset-left, 0px))));
        }
      }
      #touch-cockpit[data-deck-idle="true"] .tc-deck { opacity: 0.5; }
      /* Each cluster hugs its bottom corner, inside a thumb's reach. */
      .tc-left, .tc-right, .tc-left-col { display: flex; gap: 0.5rem; }
      .tc-left { flex-direction: row; align-items: flex-end; }
      .tc-left-col { flex-direction: column; align-items: flex-start; }
      .tc-right { flex-direction: column; align-items: flex-end; }
      .tc-row { display: flex; gap: 0.4rem; }
      .tc-deck-btn { min-width: 48px; padding: 0 0.45rem; }
      .tc-throttle {
        position: relative; width: 56px; height: 168px; overflow: hidden;
        border: 1px solid rgba(155, 185, 235, 0.42); border-radius: 12px;
        background: rgba(9, 14, 26, 0.58); pointer-events: auto; touch-action: none;
      }
      .tc-throttle-fill {
        position: absolute; left: 0; right: 0; bottom: 0; height: 50%;
        background: rgba(90, 162, 255, 0.42); pointer-events: none;
      }
      .tc-throttle-label {
        position: relative; z-index: 1; display: grid; place-items: center; height: 100%;
        font-variant-numeric: tabular-nums; pointer-events: none; text-shadow: 0 1px 2px #02040a;
      }
      .tc-rudder {
        position: relative; width: 128px; height: 44px;
        border: 1px solid rgba(155, 185, 235, 0.42); border-radius: 999px;
        background: rgba(9, 14, 26, 0.58); pointer-events: auto; touch-action: none;
      }
      .tc-rudder::before {
        content: ""; position: absolute; left: 50%; top: 8px; bottom: 8px; width: 1px;
        background: rgba(255, 255, 255, 0.28); pointer-events: none;
