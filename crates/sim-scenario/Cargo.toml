[package]
name = "sim-scenario"
description = "Deterministic flight scenarios over the Delaware corridor, the Sea of Tranquility, and Apollo 11's entry, and the bridge from camera captures to rendered frames"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["render"]
# The GPU half: turning captures into offscreen frames and worlds into meshes.
# Without it the crate is pure CPU, for headless batch rollouts.
render = ["dep:sim-render", "dep:wgpu"]

[dependencies]
flightbag = { workspace = true }
sim-apollo = { workspace = true }
sim-atmosphere = { workspace = true }
sim-devices = { workspace = true }
sim-geo = { workspace = true }
mbd-core = { workspace = true }
sim-pack = { workspace = true }
sim-render = { workspace = true, optional = true }
sim-scenery = { workspace = true }
sim-core = { workspace = true }
world = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
pollster = { workspace = true }
