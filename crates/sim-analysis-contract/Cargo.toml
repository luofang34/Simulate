[package]
name = "sim-analysis-contract"
description = "Shared versioned analysis request/result contract, terrain/sensor models, and outcome taxonomy built on sim-spacetime"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["portable-math"]
portable-math = ["sim-spacetime/portable-math"]

[dependencies]
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sim-geo = { path = "../sim-geo" }
sim-spacetime = { path = "../sim-spacetime", default-features = false }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
