<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulate</title>
    <style>
      html, body { margin: 0; height: 100%; background: #02020a; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; outline: none; }
      /* The progress surface: boot.mjs drives it while the simulator downloads,
         then the app drives the same elements until it has something to draw. */
      #boot {
        position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
        background: #02020a; color: #d7dbe6;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot[data-state="done"] { display: none; }
      #boot-card { width: min(34rem, calc(100vw - 3rem)); }
      #boot h1 { margin: 0 0 1.2rem; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8f98ad; }
      #boot-phase { margin: 0 0 0.6rem; font-size: 1.05rem; color: #f2f4f8; }
      #boot-bar { height: 6px; border-radius: 3px; background: #1b2030; overflow: hidden; }
      #boot-fill { height: 100%; width: 0; border-radius: 3px; background: #5aa2ff; transition: width 120ms linear; }
      #boot-bar[data-unknown] #boot-fill { width: 30%; animation: boot-sweep 1.4s ease-in-out infinite; }
      @keyframes boot-sweep { from { margin-left: -30%; } to { margin-left: 100%; } }
      #boot-detail { margin: 0.6rem 0 0; min-height: 1.5em; color: #8f98ad; font-variant-numeric: tabular-nums; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
      #boot[data-state="failed"] #boot-bar { display: none; }
      #boot[data-state="failed"] #boot-phase { color: #ff8a80; }
      @media (prefers-reduced-motion: reduce) { #boot-bar[data-unknown] #boot-fill { animation: none; width: 100%; opacity: 0.4; } }
    </style>
    <link data-trunk rel="rust" data-bin="simulate-app" data-initializer="boot.mjs" />
  </head>
  <body>
    <div id="boot" data-state="loading" role="status" aria-live="polite">
      <div id="boot-card">
        <h1>Simulate</h1>
        <p id="boot-phase">Loading the simulator</p>
        <div id="boot-bar" data-unknown><div id="boot-fill"></div></div>
        <p id="boot-detail"></p>
      </div>
    </div>
    <noscript>Simulate needs JavaScript and WebAssembly.</noscript>
  </body>
</html>
