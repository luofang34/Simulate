<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulate</title>
    <style>
      html, body { margin: 0; height: 100%; background: #02020a; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; outline: none; }
      /* The progress surface: boot.mjs drives it while the simulator downloads,
         then the app drives the same elements until it has something to draw. */
      #boot {
        position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
        overflow: auto; background: #02020a; color: #d7dbe6;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot[data-state="done"] { display: none; }
      #boot-card { width: min(34rem, calc(100vw - 3rem)); padding: 2rem 0; }
      #boot[data-state="plan"] #boot-card, #boot[data-state="refused"] #boot-card { width: min(52rem, calc(100vw - 3rem)); }
      #boot h1 { margin: 0 0 1.2rem; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8f98ad; }
      #boot-phase, .section h2 { margin: 0 0 0.6rem; font-size: 1.05rem; font-weight: 400; color: #f2f4f8; }
      .bar { height: 6px; border-radius: 3px; background: #1b2030; overflow: hidden; }
      .fill { height: 100%; width: 0; border-radius: 3px; background: #5aa2ff; transition: width 120ms linear; }
      .bar[data-unknown] .fill { width: 30%; animation: boot-sweep 1.4s ease-in-out infinite; }
      @keyframes boot-sweep { from { margin-left: -30%; } to { margin-left: 100%; } }
      .detail { margin: 0.6rem 0 0; min-height: 1.5em; color: #8f98ad; font-variant-numeric: tabular-nums; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
      /* Live status: a fixed number of short lines, each cut rather than wrapped, so a block
         never changes height while it updates. */
      .live { margin: 0.6rem 0 0; color: #8f98ad; font-variant-numeric: tabular-nums; user-select: text; }
      .live-line { min-height: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lines.live-rows { grid-template-columns: max-content minmax(0, 1fr); }
      .lines.live-rows dt, .lines.live-rows dd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .detail.run-link { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #boot[data-state="failed"] #boot-bar, #boot[data-state="plan"] #boot-bar, #boot[data-state="refused"] #boot-bar { display: none; }
      #boot[data-state="failed"] #boot-phase, #boot[data-state="refused"] #boot-phase { color: #ff8a80; }
      /* Labelled lines the app writes: the plan of a link, or why it is refused. */
      .lines { display: grid; grid-template-columns: max-content 1fr; gap: 0.3rem 1.2rem; margin: 1rem 0 0; }
      .lines:empty { display: none; }
      .lines dt { color: #8f98ad; }
      .lines dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; font-variant-numeric: tabular-nums; }
      #boot[data-state="refused"] #boot-lines dd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
      /* Sections the app adds under the plan: the map package, the flight. */
      .section { margin-top: 1.6rem; padding-top: 1.4rem; border-top: 1px solid #1b2030; }
      .section[data-state="refused"] h2 { color: #ff8a80; }
      .section [hidden] { display: none; }
      .section button { margin-top: 1rem; padding: 0.5rem 1.1rem; border: 1px solid #5aa2ff; border-radius: 4px; background: #10203a; color: #f2f4f8; font: inherit; cursor: pointer; }
      .section button:hover { background: #17305a; }
      /* The flight monitor: its plot, the sets' legend and the pace. */
      .plot { display: block; width: 100%; height: 260px; margin-top: 1rem; }
      /* The world view with the PFD and HSI beside it on a wide page, under it on a narrow one;
         the card widens while it flies so the window view keeps its size. */
      #boot[data-state] #boot-card:has(.world-row) { width: min(84rem, calc(100vw - 2rem)); }
      .world-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, 23rem); gap: 0.8rem; margin-top: 1rem; align-items: start; }
      .world-view { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 4px; background: #0b0e17; }
      .instrument-panels { display: flex; flex-direction: column; gap: 0.8rem; min-width: 0; }
      .instrument-panel { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 4px; background: #000; }
      @media (max-width: 56rem) {
        .world-row { grid-template-columns: minmax(0, 1fr); }
        .instrument-panels { flex-direction: row; }
        .instrument-panels .instrument-panel { flex: 1 1 0; width: auto; min-width: 0; }
      }
      /* The page's map: the app's EFB map on its own canvas, with fix labels, buttons and the picked fix's card laid over it. */
      .page-map-frame { position: relative; margin-top: 1rem; overflow: hidden; border-radius: 4px; }
      .page-map { display: block; width: 100%; height: auto; aspect-ratio: 1 / 0.62; background: #0b0e17; touch-action: none; cursor: grab; }
      .page-map:active { cursor: grabbing; }
      .page-map-labels { position: absolute; inset: 0; pointer-events: none; }
      .fix-label { position: absolute; transform: translate(8px, -130%); font: 600 12px/1 system-ui, sans-serif; color: #ffffff; text-shadow: 0 0 3px #05070b, 0 0 3px #05070b; white-space: nowrap; }
      .fix-label.active { color: #ff40ff; }
      .truth-label { position: absolute; transform: translate(14px, 6px); font: 600 12px/1 system-ui, sans-serif; color: #ffe066; text-shadow: 0 0 3px #05070b, 0 0 3px #05070b; white-space: nowrap; pointer-events: none; }
      .series.groundtruth { cursor: default; padding-left: 1.6rem; }
      .fix-label.flown { color: #9aa1b2; }
      .page-map-card { position: absolute; transform: translate(-50%, 14px); min-width: 11rem; padding: 0.5rem 0.7rem; border: 1px solid #2b3245; border-radius: 6px; background: rgba(11, 14, 23, 0.94); font-size: 13px; line-height: 1.45; font-variant-numeric: tabular-nums; pointer-events: none; }
      .page-map-card .ident { font-weight: 600; color: #f2f4f8; }
      .page-map-buttons { position: absolute; top: 0.5rem; right: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: flex-end; max-width: calc(100% - 1rem); }
      .section .page-map-buttons button { margin: 0; padding: 0.3rem 0.6rem; min-width: 2.2rem; border-color: #2b3245; background: rgba(11, 14, 23, 0.85); font-size: 13px; }
      .section .page-map-buttons button:disabled { opacity: 0.4; cursor: default; }
      .track-map { display: block; width: 100%; height: auto; margin-top: 1rem; border-radius: 4px; }
      .frame-panel { display: flex; flex-wrap: wrap; gap: 1rem 1.2rem; margin-top: 1rem; align-items: flex-start; }
      .frame-panel > div { flex: 1 1 14rem; min-width: 0; }
      .frame-panel .detail { margin-top: 0; }
      .match-panel { margin-top: 1rem; }
      .match { display: block; max-width: 100%; height: auto; border-radius: 4px; background: #0b0e17; }
      .frame { display: block; width: 400px; max-width: 100%; height: auto; border-radius: 4px; background: #0b0e17; }
      .legend, .sensor-rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.3rem 1.2rem; margin-top: 1rem; align-items: center; }
      .role { padding: 0.05rem 0.45rem; border: 1px solid #2b3245; border-radius: 999px; color: #8f98ad; font-size: 12px; white-space: nowrap; }
      /* Whose navigation the flight is flown on. */
      .steering { margin-top: 1rem; padding: 0.7rem 0.9rem; border: 1px solid #2b3245; border-radius: 6px; background: #0b0e17; }
      .steering .detail { margin-top: 0.35rem; }
      .steering-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0; font-size: 1.05rem; color: #f2f4f8; }
      .steering-head .swatch { width: 22px; height: 6px; }
      .steering-others a { margin-right: 0.8rem; color: #5aa2ff; }
      /* The sensors' fault switches: each a checkbox drawn as a button, with what its sensor's consumers report beside it. */
      .sensor-controls { margin-top: 1rem; }
      .sensor-controls > .detail { margin: 0; }
      .sensor-rows { margin-top: 0.5rem; gap: 0.4rem 1rem; }
      .fault-switch { display: inline-flex; gap: 0.45rem; align-items: center; min-width: 8.5rem; padding: 0.4rem 0.8rem; border: 1px solid #2b3245; border-radius: 4px; background: #10203a; color: #f2f4f8; cursor: pointer; user-select: none; }
      .fault-switch:hover { background: #17305a; }
      .fault-switch:has(input:checked) { border-color: #ffb454; background: #3a2a10; color: #ffd9a0; }
      .fault-switch:has(input:disabled) { opacity: 0.5; cursor: default; }
      .section .fault-switch input { accent-color: #ffb454; }
      .sensor-rows .value { white-space: normal; overflow: visible; }
      .sensor-rows .value.active { color: #ffd9a0; }
      .gnss-checks { margin-top: 0.6rem; }
      .gnss-checks.alert dd { color: #ffd9a0; }
      @media (max-width: 40rem) { .sensor-rows { grid-template-columns: minmax(0, 1fr); } }
      .series { display: flex; gap: 0.5rem; align-items: center; cursor: pointer; }
      .swatch { display: inline-block; width: 16px; height: 4px; border-radius: 2px; }
      .value { min-width: 0; color: #8f98ad; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .speeds { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; margin-top: 1rem; color: #8f98ad; }
      .speeds label { display: flex; gap: 0.3rem; align-items: center; color: #d7dbe6; cursor: pointer; }
      .section input { accent-color: #5aa2ff; }
      @media (prefers-reduced-motion: reduce) { .bar[data-unknown] .fill { animation: none; width: 100%; opacity: 0.4; } }
    </style>
    <link data-trunk rel="rust" data-bin="simulate-app" data-initializer="boot.mjs" />
    <link data-trunk rel="copy-file" href="opfs-writer.js" />
  </head>
  <body>
    <div id="boot" data-state="loading" role="status" aria-live="polite">
      <div id="boot-card">
        <h1>Simulate</h1>
        <p id="boot-phase">Loading the simulator</p>
        <div id="boot-bar" class="bar" data-unknown><div id="boot-fill" class="fill"></div></div>
        <p id="boot-detail" class="detail"></p>
        <dl id="boot-lines" class="lines"></dl>
      </div>
    </div>
    <noscript>Simulate needs JavaScript and WebAssembly.</noscript>
  </body>
</html>
