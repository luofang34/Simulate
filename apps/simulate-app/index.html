<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulate</title>
    <style>
      html, body { margin: 0; height: 100%; background: #02020a; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; outline: none; }
      /* The progress surface: boot.mjs drives it while the simulator downloads,
         then the app drives the same elements until it has something to draw. */
      #boot {
        position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
        overflow: auto; background: #02020a; color: #d7dbe6;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot[data-state="done"] { display: none; }
      #boot-card { width: min(34rem, calc(100vw - 3rem)); padding: 2rem 0; }
      #boot[data-state="plan"] #boot-card, #boot[data-state="refused"] #boot-card { width: min(52rem, calc(100vw - 3rem)); }
      #boot h1 { margin: 0 0 1.2rem; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8f98ad; }
      #boot-phase, .section h2 { margin: 0 0 0.6rem; font-size: 1.05rem; font-weight: 400; color: #f2f4f8; }
      .bar { height: 6px; border-radius: 3px; background: #1b2030; overflow: hidden; }
      .fill { height: 100%; width: 0; border-radius: 3px; background: #5aa2ff; transition: width 120ms linear; }
      .bar[data-unknown] .fill { width: 30%; animation: boot-sweep 1.4s ease-in-out infinite; }
      @keyframes boot-sweep { from { margin-left: -30%; } to { margin-left: 100%; } }
      .detail { margin: 0.6rem 0 0; min-height: 1.5em; color: #8f98ad; font-variant-numeric: tabular-nums; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
      #boot[data-state="failed"] #boot-bar, #boot[data-state="plan"] #boot-bar, #boot[data-state="refused"] #boot-bar { display: none; }
      #boot[data-state="failed"] #boot-phase, #boot[data-state="refused"] #boot-phase { color: #ff8a80; }
      /* Labelled lines the app writes: the plan of a link, or why it is refused. */
      .lines { display: grid; grid-template-columns: max-content 1fr; gap: 0.3rem 1.2rem; margin: 1rem 0 0; }
      .lines:empty { display: none; }
      .lines dt { color: #8f98ad; }
      .lines dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; font-variant-numeric: tabular-nums; }
      #boot[data-state="refused"] #boot-lines dd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
      /* Sections the app adds under the plan: the map package, the flight. */
      .section { margin-top: 1.6rem; padding-top: 1.4rem; border-top: 1px solid #1b2030; }
      .section[data-state="refused"] h2 { color: #ff8a80; }
      .section [hidden] { display: none; }
      .section button { margin-top: 1rem; padding: 0.5rem 1.1rem; border: 1px solid #5aa2ff; border-radius: 4px; background: #10203a; color: #f2f4f8; font: inherit; cursor: pointer; }
      .section button:hover { background: #17305a; }
      /* The flight monitor: its plot, the sets' legend, the means' switches and the pace. */
      .plot { display: block; width: 100%; height: 260px; margin-top: 1rem; }
      .legend, .switches { display: grid; grid-template-columns: max-content 1fr; gap: 0.3rem 1.2rem; margin-top: 1rem; align-items: center; }
      .series { display: flex; gap: 0.5rem; align-items: center; cursor: pointer; }
      .swatch { display: inline-block; width: 16px; height: 4px; border-radius: 2px; }
      .value { color: #8f98ad; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      .speeds { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; margin-top: 1rem; color: #8f98ad; }
      .speeds label { display: flex; gap: 0.3rem; align-items: center; color: #d7dbe6; cursor: pointer; }
      .section input { accent-color: #5aa2ff; }
      @media (prefers-reduced-motion: reduce) { .bar[data-unknown] .fill { animation: none; width: 100%; opacity: 0.4; } }
    </style>
    <link data-trunk rel="rust" data-bin="simulate-app" data-initializer="boot.mjs" />
  </head>
  <body>
    <div id="boot" data-state="loading" role="status" aria-live="polite">
      <div id="boot-card">
        <h1>Simulate</h1>
        <p id="boot-phase">Loading the simulator</p>
        <div id="boot-bar" class="bar" data-unknown><div id="boot-fill" class="fill"></div></div>
        <p id="boot-detail" class="detail"></p>
        <dl id="boot-lines" class="lines"></dl>
      </div>
    </div>
    <noscript>Simulate needs JavaScript and WebAssembly.</noscript>
  </body>
</html>
