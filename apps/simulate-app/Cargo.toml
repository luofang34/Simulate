[package]
name = "simulate-app"
description = "Simulate executable for desktop and the browser"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sim-apollo = { workspace = true }
sim-atmosphere = { workspace = true }
sim-geo = { workspace = true }
sim-input = { workspace = true }
sim-render = { workspace = true }
sim-scenario = { workspace = true }
sim-core = { workspace = true }
gilrs = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }
winit = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
tracing-wasm = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window"] }
