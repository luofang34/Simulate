[package]
name = "link-replay"
description = "Native headless flight runner and training-grade telemetry recorder for Simulate links, scenarios, and built-in presets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "link-replay"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
glam = { workspace = true }
image = { workspace = true }
navigate-data = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sim-chain-trial = { workspace = true }
sim-flight-chain = { workspace = true }
sim-geo = { workspace = true }
sim-link = { workspace = true }
sim-link-host = { workspace = true }
sim-navdata = { workspace = true }
sim-navigate = { workspace = true }
sim-render = { workspace = true }
sim-scenery = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
