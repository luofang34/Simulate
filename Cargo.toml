[workspace]
resolver = "3"
members = [
    "adapters/sim-aviate",
    "adapters/sim-indicate",
    "adapters/sim-maplibre",
    "adapters/sim-navigate",
    "adapters/sim-pilotage",
    "apps/ironbird",
    "apps/simulate-app",
    "crates/sim-analysis",
    "crates/sim-analysis-contract",
    "crates/sim-atmosphere",
    "crates/sim-devices",
    "crates/sim-geo",
    "crates/sim-input",
    "crates/sim-mission",
    "crates/sim-orbital",
    "crates/sim-pack",
    "crates/sim-render",
    "crates/sim-scenario",
    "crates/sim-scenery",
    "crates/sim-spacetime",
    "crates/sim-universe",
    "crates/sim-core",
    "crates/sim-xil",
    "vehicles/apollo-11",
    "vehicles/p38g",
    "vehicles/raketa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
jsbsim = { version = "0.2.0", path = "../jsbsim-rs/crates/jsbsim", default-features = false }
ironbird = { path = "apps/ironbird" }
sim-apollo = { path = "vehicles/apollo-11" }
sim-p38g = { path = "vehicles/p38g" }
sim-raketa = { path = "vehicles/raketa" }
sim-analysis = { path = "crates/sim-analysis" }
sim-analysis-contract = { path = "crates/sim-analysis-contract" }
sim-atmosphere = { path = "crates/sim-atmosphere" }
sim-aviate = { path = "adapters/sim-aviate" }
sim-devices = { path = "crates/sim-devices" }
sim-geo = { path = "crates/sim-geo" }
sim-indicate = { path = "adapters/sim-indicate" }
sim-input = { path = "crates/sim-input" }
sim-maplibre = { path = "adapters/sim-maplibre" }
sim-mission = { path = "crates/sim-mission" }
sim-navigate = { path = "adapters/sim-navigate" }
sim-orbital = { path = "crates/sim-orbital" }
sim-pack = { path = "crates/sim-pack" }
sim-pilotage = { path = "adapters/sim-pilotage" }
sim-render = { path = "crates/sim-render" }
sim-scenario = { path = "crates/sim-scenario", default-features = false }
sim-scenery = { path = "crates/sim-scenery" }
sim-spacetime = { path = "crates/sim-spacetime" }
sim-universe = { path = "crates/sim-universe" }
sim-core = { path = "crates/sim-core" }
sim-xil = { path = "crates/sim-xil" }

aviate-core = { version = "0.1.3", path = "../Aviate/aviate-core", default-features = false, features = ["mc", "fw"] }
aviate-hal-io = { version = "0.1.3", path = "../Aviate/aviate-hal/io" }
aviate-xil-contract = { version = "0.1.0", path = "../Aviate/aviate-hal/xil/contract" }
aviate-xil-direct = { version = "0.1.3", path = "../Aviate/aviate-hal/xil/direct" }
flightbag = { version = "0.1.0", path = "../Flightbag/crates/flightbag" }
flightbag-core = { version = "0.1.0", path = "../Flightbag/crates/flightbag-core" }
world = { version = "0.1.0", path = "../world/crates/world", features = ["moving"] }
world-airmass = { version = "0.1.0", path = "../world/crates/world-airmass" }
world-atmosphere = { version = "0.1.0", path = "../world/crates/world-atmosphere" }
world-core = { version = "0.1.0", path = "../world/crates/world-core" }
world-geomag = { version = "0.1.0", path = "../world/crates/world-geomag" }
world-notices = { version = "0.1.0", path = "../world/crates/world-notices" }
world-surveillance = { version = "0.1.0", path = "../world/crates/world-surveillance" }
indicate-alerts = { version = "0.1.0", path = "../Indicate/crates/indicate-alerts" }
indicate-frames = { version = "0.1.0", path = "../Indicate/crates/indicate-frames" }
indicate-instrument-analog = { version = "0.1.0", path = "../Indicate/sets/indicate-instrument-analog" }
indicate-instrument-descriptor = { version = "0.1.0", path = "../Indicate/crates/indicate-instrument-descriptor" }
indicate-instrument-feeder = { version = "0.1.0", path = "../Indicate/crates/indicate-instrument-feeder" }
indicate-instrument-glyphs = { version = "0.1.0", path = "../Indicate/crates/indicate-instrument-glyphs" }
indicate-instrument-hud = { version = "0.1.0", path = "../Indicate/sets/indicate-instrument-hud" }
indicate-instrument-panels = { version = "0.1.0", path = "../Indicate/sets/indicate-instrument-panels" }
indicate-instrument-raster = { version = "0.1.0", path = "../Indicate/crates/indicate-instrument-raster" }
indicate-instrument-registry = { version = "0.1.0", path = "../Indicate/crates/indicate-instrument-registry" }
indicate-instrument-scene = { version = "0.1.0", path = "../Indicate/crates/indicate-instrument-scene" }
indicate-instrument-state = { version = "0.1.0", path = "../Indicate/crates/indicate-instrument-state" }
indicate-instrument-symbology = { version = "0.1.0", path = "../Indicate/crates/indicate-instrument-symbology" }
indicate-instrument-volumes = { version = "0.1.0", path = "../Indicate/sets/indicate-instrument-volumes" }
indicate-interaction = { version = "0.1.0", path = "../Indicate/crates/indicate-interaction" }
mbd-core = { version = "0.1.0", path = "../mbd/crates/mbd-core" }
mbd-airdata = { version = "0.1.0", path = "../mbd/crates/mbd-airdata" }
navigate-camera = { version = "0.1.0", path = "../Navigate/crates/navigate-camera" }
navigate-celestial = { version = "0.1.0", path = "../Navigate/crates/navigate-celestial" }
navigate-contract = { version = "0.1.0", path = "../Navigate/crates/navigate-contract" }
navigate-fusion = { version = "0.1.0", path = "../Navigate/crates/navigate-fusion" }
navigate-geodesy = { version = "0.1.0", path = "../Navigate/crates/navigate-geodesy" }
navigate-startrack = { version = "0.1.0", path = "../Navigate/crates/navigate-startrack" }
navigate-visual = { version = "0.1.0", path = "../Navigate/crates/navigate-visual" }
pilotage-adapter-api = { version = "0.1.0", git = "https://github.com/luofang34/Pilotage", rev = "e2714e54c480670561d2f6c91bb64e5e26b81a00" }
pilotage-aircraft = { version = "0.1.0", git = "https://github.com/luofang34/Pilotage", rev = "e2714e54c480670561d2f6c91bb64e5e26b81a00" }
pilotage-calibration-id = { version = "0.1.0", git = "https://github.com/luofang34/Pilotage", rev = "e2714e54c480670561d2f6c91bb64e5e26b81a00" }
pilotage-camera-calibration = { version = "0.1.0", git = "https://github.com/luofang34/Pilotage", rev = "e2714e54c480670561d2f6c91bb64e5e26b81a00" }
pilotage-geo = { version = "0.1.0", git = "https://github.com/luofang34/Pilotage", rev = "e2714e54c480670561d2f6c91bb64e5e26b81a00" }
pilotage-protocol = { version = "0.1.0", git = "https://github.com/luofang34/Pilotage", rev = "e2714e54c480670561d2f6c91bb64e5e26b81a00" }
pilotage-timing = { version = "0.1.0", git = "https://github.com/luofang34/Pilotage", rev = "e2714e54c480670561d2f6c91bb64e5e26b81a00" }
syspack = { version = "0.1.0", path = "../mbd/crates/syspack" }
maplibre = { version = "0.1.0", path = "../maplibre-rs-experimental/maplibre", default-features = false, features = ["headless", "raster", "geojson", "experimental"] }

async-trait = "0.1"
bytemuck = "1.25"
cgmath = "0.18"
console_error_panic_hook = "0.1.7"
gilrs = "0.11.2"
glam = "0.33"
hifitime = "4.3.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libm = "0.2"
memory-stats = "1.2"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
openusd = { version = "0.8.0", default-features = false }
openusd-schemas = { version = "0.8.0", default-features = false, features = ["geom", "shade", "physics", "lux"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-wasm = "0.2.1"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
web-time = "1"
wgpu = "30.0.1"
winit = "0.30.13"

# jsbsim-rs is at parity with C++ JSBSim's speed only with one codegen unit.
[profile.release]
codegen-units = 1

# Debug nalgebra turns a corridor test's pose-graph solves into minutes, and
# its generics compile into the crate that uses them.
[profile.dev.package.nalgebra]
opt-level = 2

[profile.dev.package.navigate-visual]
opt-level = 2

[profile.dev.package.navigate-fusion]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

# Pilotage pins Indicate by git revision; one local tree keeps every `indicate-*`
# crate a single linked copy.
[patch."https://github.com/luofang34/Indicate.git"]
indicate-alerts = { path = "../Indicate/crates/indicate-alerts" }
indicate-frames = { path = "../Indicate/crates/indicate-frames" }
indicate-instrument-glyphs = { path = "../Indicate/crates/indicate-instrument-glyphs" }
indicate-instrument-panels = { path = "../Indicate/sets/indicate-instrument-panels" }
indicate-instrument-registry = { path = "../Indicate/crates/indicate-instrument-registry" }
indicate-instrument-scene = { path = "../Indicate/crates/indicate-instrument-scene" }
indicate-instrument-state = { path = "../Indicate/crates/indicate-instrument-state" }

# Aviate pins `world` by git revision; patching keeps every `world-*` crate a
# single linked copy across firmware kernels and the simulator.
[patch."https://github.com/luofang34/world"]
world-atmosphere = { path = "../world/crates/world-atmosphere" }
world-core = { path = "../world/crates/world-core" }
world-geomag = { path = "../world/crates/world-geomag" }

# Pinned cross-repository source manifest for reproducible multi-repo checkouts.
[workspace.metadata.external_sources]
jsbsim-rs = { git = "https://github.com/luofang34/jsbsim-rs.git", rev = "ca376d63d1ba3453ad5ca97dd593aacb4d20b218", path = "../jsbsim-rs", version = "0.2.0" }
Aviate = { git = "https://github.com/luofang34/Aviate.git", rev = "6974c39b0a722e4819db5db787a32eecef9860d8", path = "../Aviate", version = "0.1.3" }
Flightbag = { git = "https://github.com/luofang34/Flightbag.git", rev = "c837ec273f97d7abd1a1fff35968c1e6aca0007a", path = "../Flightbag", version = "0.1.0" }
world = { git = "https://github.com/luofang34/world.git", rev = "075e2cafee7fa3dc044f28d750f6b1094d5c5ab2", path = "../world", version = "0.1.0" }
Indicate = { git = "https://github.com/luofang34/Indicate.git", rev = "11ee0fbc8c759200614186fb333722232ac3caee", path = "../Indicate", version = "0.1.0" }
mbd = { git = "https://github.com/luofang34/mbd.git", rev = "861574978e7e2d82a91e9688f0d145340a21b6d2", path = "../mbd", version = "0.1.0" }
Navigate = { git = "https://github.com/luofang34/Navigate.git", rev = "9fe809deae3aa6bd12a5e34bf3eec801c03cd49a", path = "../Navigate", version = "0.1.0" }
Pilotage = { git = "https://github.com/luofang34/Pilotage.git", rev = "e2714e54c480670561d2f6c91bb64e5e26b81a00", version = "0.1.0" }
maplibre-rs-experimental = { git = "https://github.com/luofang34/maplibre-rs-experimental.git", rev = "4bb93f04947680df57dbb9b810ed3f458414df7d", path = "../maplibre-rs-experimental", version = "0.1.0" }

