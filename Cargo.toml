async-trait = "0.1"
bytemuck = "1.25"
cgmath = "0.18"
console_error_panic_hook = "0.1.7"
gilrs = "0.11.2"
glam = "0.33"
hifitime = "4.3.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libm = "0.2"
memory-stats = "1.2"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
openusd = { version = "0.8.0", default-features = false }
openusd-schemas = { version = "0.8.0", default-features = false, features = ["geom", "shade", "physics", "lux"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
spicekit = "0.2.3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-wasm = "0.2.1"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
web-time = "1"
wgpu = "30.0.1"
winit = "0.30.13"

# jsbsim-rs is at parity with C++ JSBSim's speed only with one codegen unit.
[profile.release]
codegen-units = 1

# Debug nalgebra turns a corridor test's pose-graph solves into minutes, and
# its generics compile into the crate that uses them.
[profile.dev.package.nalgebra]
opt-level = 2

[profile.dev.package.navigate-visual]
opt-level = 2

[profile.dev.package.navigate-fusion]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
