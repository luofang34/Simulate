[workspace]
resolver = "3"
members = [
    "adapters/sim-aviate",
    "adapters/sim-flight-chain",
    "adapters/sim-indicate",
    "adapters/sim-maplibre",
    "adapters/sim-navigate",
    "adapters/sim-pilotage",
    "apps/ironbird",
    "apps/nav-trial",
    "apps/simulate-app",
    "crates/sim-analysis",
    "crates/sim-analysis-contract",
    "crates/sim-atmosphere",
    "crates/sim-devices",
    "crates/sim-geo",
    "crates/sim-input",
    "crates/sim-mission",
    "crates/sim-orbital",
    "crates/sim-pack",
    "crates/sim-render",
    "crates/sim-scenario",
    "crates/sim-scenery",
    "crates/sim-spacetime",
    "crates/sim-universe",
    "crates/sim-core",
    "crates/sim-xil",
    "vehicles/apollo-11",
    "vehicles/p38g",
    "vehicles/raketa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Sibling repositories are git dependencies, every crate of one repository at
# the same `rev` (scripts/check-sibling-sources.sh);
# scripts/use-local-siblings.sh builds against local checkouts instead.
jsbsim = { git = "https://github.com/luofang34/jsbsim-rs", rev = "ca376d63d1ba3453ad5ca97dd593aacb4d20b218", default-features = false }
ironbird = { path = "apps/ironbird" }
sim-apollo = { path = "vehicles/apollo-11" }
sim-p38g = { path = "vehicles/p38g" }
sim-raketa = { path = "vehicles/raketa" }
sim-analysis = { path = "crates/sim-analysis" }
sim-analysis-contract = { path = "crates/sim-analysis-contract" }
sim-atmosphere = { path = "crates/sim-atmosphere" }
sim-aviate = { path = "adapters/sim-aviate" }
sim-flight-chain = { path = "adapters/sim-flight-chain" }
sim-devices = { path = "crates/sim-devices" }
sim-geo = { path = "crates/sim-geo" }
sim-indicate = { path = "adapters/sim-indicate" }
sim-input = { path = "crates/sim-input" }
sim-maplibre = { path = "adapters/sim-maplibre" }
sim-mission = { path = "crates/sim-mission" }
sim-navigate = { path = "adapters/sim-navigate" }
sim-orbital = { path = "crates/sim-orbital" }
sim-pack = { path = "crates/sim-pack" }
sim-pilotage = { path = "adapters/sim-pilotage" }
sim-render = { path = "crates/sim-render" }
sim-scenario = { path = "crates/sim-scenario", default-features = false }
sim-scenery = { path = "crates/sim-scenery" }
sim-spacetime = { path = "crates/sim-spacetime" }
sim-universe = { path = "crates/sim-universe" }
sim-core = { path = "crates/sim-core" }
sim-xil = { path = "crates/sim-xil" }

aviate-core = { git = "https://github.com/luofang34/Aviate", rev = "816b1a65cf05b9aaf3b149fcd97ab428afc29b6d", default-features = false, features = ["mc", "fw"] }
