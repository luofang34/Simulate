[workspace]
resolver = "3"
members = [
    "adapters/sim-aviate",
    "adapters/sim-indicate",
    "adapters/sim-maplibre",
    "adapters/sim-navigate",
    "adapters/sim-pilotage",
    "apps/ironbird",
    "apps/simulate-app",
    "crates/sim-atmosphere",
    "crates/sim-devices",
    "crates/sim-geo",
    "crates/sim-input",
    "crates/sim-pack",
    "crates/sim-render",
    "crates/sim-scenario",
    "crates/sim-scenery",
    "crates/sim-core",
    "crates/sim-xil",
    "vehicles/apollo-11",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
jsbsim = { version = "0.2.0", path = "../jsbsim-rs/crates/jsbsim", default-features = false }
ironbird = { path = "apps/ironbird" }
sim-apollo = { path = "vehicles/apollo-11" }
sim-atmosphere = { path = "crates/sim-atmosphere" }
sim-aviate = { path = "adapters/sim-aviate" }
sim-devices = { path = "crates/sim-devices" }
sim-geo = { path = "crates/sim-geo" }
sim-indicate = { path = "adapters/sim-indicate" }
sim-input = { path = "crates/sim-input" }
sim-maplibre = { path = "adapters/sim-maplibre" }
sim-navigate = { path = "adapters/sim-navigate" }
sim-pack = { path = "crates/sim-pack" }
sim-pilotage = { path = "adapters/sim-pilotage" }
sim-render = { path = "crates/sim-render" }
sim-scenario = { path = "crates/sim-scenario", default-features = false }
sim-scenery = { path = "crates/sim-scenery" }
sim-core = { path = "crates/sim-core" }
sim-xil = { path = "crates/sim-xil" }

aviate-core = { path = "../Aviate/aviate-core", default-features = false, features = ["mc", "fw"] }
aviate-hal-io = { path = "../Aviate/aviate-hal/io" }
aviate-xil-contract = { path = "../Aviate/aviate-hal/xil/contract" }
aviate-xil-direct = { path = "../Aviate/aviate-hal/xil/direct" }
flightbag = { path = "../Flightbag/crates/flightbag" }
flightbag-core = { path = "../Flightbag/crates/flightbag-core" }
world = { path = "../world/crates/world", features = ["moving"] }
world-airmass = { path = "../world/crates/world-airmass" }
world-atmosphere = { path = "../world/crates/world-atmosphere" }
world-core = { path = "../world/crates/world-core" }
world-geomag = { path = "../world/crates/world-geomag" }
world-notices = { path = "../world/crates/world-notices" }
world-surveillance = { path = "../world/crates/world-surveillance" }
indicate-alerts = { path = "../Indicate/crates/indicate-alerts" }
indicate-frames = { path = "../Indicate/crates/indicate-frames" }
indicate-instrument-descriptor = { path = "../Indicate/crates/indicate-instrument-descriptor" }
indicate-instrument-feeder = { path = "../Indicate/crates/indicate-instrument-feeder" }
indicate-instrument-glyphs = { path = "../Indicate/crates/indicate-instrument-glyphs" }
indicate-instrument-hud = { path = "../Indicate/sets/indicate-instrument-hud" }
indicate-instrument-panels = { path = "../Indicate/sets/indicate-instrument-panels" }
indicate-instrument-raster = { path = "../Indicate/crates/indicate-instrument-raster" }
indicate-instrument-registry = { path = "../Indicate/crates/indicate-instrument-registry" }
indicate-instrument-scene = { path = "../Indicate/crates/indicate-instrument-scene" }
indicate-instrument-state = { path = "../Indicate/crates/indicate-instrument-state" }
indicate-instrument-symbology = { path = "../Indicate/crates/indicate-instrument-symbology" }
indicate-instrument-volumes = { path = "../Indicate/sets/indicate-instrument-volumes" }
indicate-interaction = { path = "../Indicate/crates/indicate-interaction" }
mbd-core = { path = "../mbd/crates/mbd-core" }
navigate-camera = { path = "../Navigate-wt-lis/crates/navigate-camera" }
navigate-celestial = { path = "../Navigate-wt-lis/crates/navigate-celestial" }
navigate-contract = { path = "../Navigate-wt-lis/crates/navigate-contract" }
navigate-fusion = { path = "../Navigate-wt-lis/crates/navigate-fusion" }
navigate-geodesy = { path = "../Navigate-wt-lis/crates/navigate-geodesy" }
navigate-startrack = { path = "../Navigate-wt-lis/crates/navigate-startrack" }
navigate-visual = { path = "../Navigate-wt-lis/crates/navigate-visual" }
pilotage-adapter-api = { git = "https://github.com/luofang34/Pilotage", rev = "428dc5c8a62a88d17318b5ef7c339e2ab3af8acd" }
pilotage-aircraft = { git = "https://github.com/luofang34/Pilotage", rev = "428dc5c8a62a88d17318b5ef7c339e2ab3af8acd" }
pilotage-calibration-id = { git = "https://github.com/luofang34/Pilotage", rev = "428dc5c8a62a88d17318b5ef7c339e2ab3af8acd" }
pilotage-camera-calibration = { git = "https://github.com/luofang34/Pilotage", rev = "428dc5c8a62a88d17318b5ef7c339e2ab3af8acd" }
pilotage-geo = { git = "https://github.com/luofang34/Pilotage", rev = "428dc5c8a62a88d17318b5ef7c339e2ab3af8acd" }
pilotage-protocol = { git = "https://github.com/luofang34/Pilotage", rev = "428dc5c8a62a88d17318b5ef7c339e2ab3af8acd" }
pilotage-timing = { git = "https://github.com/luofang34/Pilotage", rev = "428dc5c8a62a88d17318b5ef7c339e2ab3af8acd" }
syspack = { path = "../mbd/crates/syspack" }
maplibre = { path = "../maplibre-rs-experimental/maplibre", default-features = false, features = ["headless", "raster", "geojson", "experimental"] }

async-trait = "0.1"
bytemuck = "1.25"
cgmath = "0.18"
console_error_panic_hook = "0.1.7"
gilrs = "0.11.2"
glam = "0.33"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
memory-stats = "1.2"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
openusd = { version = "0.8.0", default-features = false }
openusd-schemas = { version = "0.8.0", default-features = false, features = ["geom", "shade", "physics", "lux"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-wasm = "0.2.1"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
web-time = "1"
wgpu = "30.0.1"
winit = "0.30.13"

# jsbsim-rs is at parity with C++ JSBSim's speed only with one codegen unit.
[profile.release]
codegen-units = 1

# Debug nalgebra turns a corridor test's pose-graph solves into minutes, and
# its generics compile into the crate that uses them.
[profile.dev.package.nalgebra]
opt-level = 2

[profile.dev.package.navigate-visual]
opt-level = 2

[profile.dev.package.navigate-fusion]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

# Pilotage pins Indicate by git revision; one local tree keeps every `indicate-*`
# crate a single linked copy.
[patch."https://github.com/luofang34/Indicate.git"]
indicate-alerts = { path = "../Indicate/crates/indicate-alerts" }
indicate-frames = { path = "../Indicate/crates/indicate-frames" }
indicate-instrument-glyphs = { path = "../Indicate/crates/indicate-instrument-glyphs" }
indicate-instrument-panels = { path = "../Indicate/sets/indicate-instrument-panels" }
indicate-instrument-registry = { path = "../Indicate/crates/indicate-instrument-registry" }
indicate-instrument-scene = { path = "../Indicate/crates/indicate-instrument-scene" }
indicate-instrument-state = { path = "../Indicate/crates/indicate-instrument-state" }

# Aviate pins `world` by git revision; patching keeps every `world-*` crate a
# single linked copy across firmware kernels and the simulator.
[patch."https://github.com/luofang34/world"]
world-atmosphere = { path = "../world/crates/world-atmosphere" }
world-core = { path = "../world/crates/world-core" }
world-geomag = { path = "../world/crates/world-geomag" }
