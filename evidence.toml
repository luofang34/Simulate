# Static architecture and structure gates for FSgame (Simulate).
# Run: cargo evidence gate --format=jsonl
# scripts/check-architecture.sh and scripts/check-structure.sh stay authoritative
# until the owner retires them.
schema_version = 1

[workspace]
name = "simulate"
exclude_paths = ["target/**", "**/dist/**", "book/build/**", ".claude/**"]

[architecture]
in_scope = [
    "sim-geo", "sim-link", "sim-spacetime", "sim-atmosphere", "sim-core", "sim-analysis-contract",
    "sim-scenery", "sim-orbital", "sim-analysis", "sim-devices", "sim-xil", "sim-input",
    "sim-render", "sim-mission", "sim-universe", "sim-pack", "sim-scenario",
    "sim-apollo", "sim-raketa", "sim-p38g",
    "sim-aviate", "sim-navdata", "sim-indicate", "sim-pilotage", "sim-navigate",
    "sim-flight-chain", "sim-flightdeck", "sim-maplibre", "sim-chain-trial", "sim-link-host",
    "ironbird", "link-replay", "nav-trial", "simulate-app",
]
no_out_of_scope_deps = false
forbidden_external_transitive = false
require_all_crates_layered = true
git_dep_lockstep = true
export_hygiene_crates = ["sim-analysis-contract", "sim-spacetime", "sim-orbital", "sim-analysis", "sim-mission"]

# Only sim-bodies links world-potential (in_scope above omits it on purpose).
[architecture.forbidden_external]
world-potential = "read gravity and magnetic fields through sim-bodies, the only adapter onto world-potential"

[[architecture.layers]]
name = "foundation"
crates = ["sim-geo", "sim-link"]
allow_same_layer = false

[[architecture.layers]]
name = "environment"
crates = ["sim-spacetime", "sim-atmosphere"]
allow_same_layer = false

[[architecture.layers]]
name = "domain_core"
crates = ["sim-bodies", "sim-analysis-contract", "sim-core", "sim-scenery"]
allow_same_layer = false

[[architecture.layers]]
name = "orbital_devices_render"
crates = ["sim-orbital", "sim-analysis", "sim-devices", "sim-xil", "sim-input", "sim-render"]
allow_same_layer = false

[[architecture.layers]]
name = "mission_universe_pack"
crates = ["sim-mission", "sim-universe", "sim-pack"]
allow_same_layer = false

[[architecture.layers]]
name = "vehicles"
crates = ["sim-apollo", "sim-raketa", "sim-p38g"]
allow_same_layer = false

[[architecture.layers]]
name = "scenario"
crates = ["sim-scenario"]
allow_same_layer = false

[[architecture.layers]]
name = "adapter_endpoints"
crates = ["sim-aviate", "sim-navdata", "sim-indicate", "sim-pilotage", "sim-navigate"]
allow_same_layer = false

[[architecture.layers]]
name = "adapter_composites"
crates = ["sim-flight-chain", "sim-flightdeck", "sim-maplibre"]
allow_same_layer = false

[[architecture.layers]]
name = "adapter_chain_trial"
crates = ["sim-chain-trial"]
allow_same_layer = false

[[architecture.layers]]
name = "adapter_link_host"
crates = ["sim-link-host"]
allow_same_layer = false

[[architecture.layers]]
name = "apps"
crates = ["ironbird", "link-replay", "nav-trial", "simulate-app"]
allow_same_layer = false

[[architecture.dep_closures]]
id = "sim-analysis-contract-closure"
package = "sim-analysis-contract"
forbid_crates = { "sim-core" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "jsbsim" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "sim-scenery" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "flightbag" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "flightbag-core" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "sim-render" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "wgpu" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "navigate-celestial" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "navigate-fusion" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "navigate-visual" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "hifitime" = "orbital stack must not reach flight dynamics, scenery, rendering, or Navigate filter/visual/sky crates", "sim-orbital" = "`sim-analysis-contract` sits below `sim-orbital` in the orbital DAG", "sim-analysis" = "`sim-analysis-contract` sits below `sim-analysis` in the orbital DAG", "sim-mission" = "`sim-analysis-contract` sits below `sim-mission` in the orbital DAG" }

