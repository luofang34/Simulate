id = "sim-core-no-orbital"
package = "sim-core"
forbid_crates = { "sim-orbital" = "sim-core reaches the orbital stack only through sim-universe", "sim-mission" = "sim-core reaches the orbital stack only through sim-universe", "sim-universe" = "sim-core reaches the orbital stack only through sim-universe" }

[structure]
enabled = true
max_rs_lines = 500
max_lib_rs_lines = 100
max_fn_lines = 80
require_lib_rs_doc = true
forbid_mod_rs = true
forbid_generic_filenames = ["utils.rs", "helpers.rs", "common.rs"]
forbid_stray_artifacts = true

[[banned_patterns]]
id = "no-plus-equals-one"
pattern = '\+= *1([^0-9.]|$)'
languages = ["rust"]
include_globs = ["crates/**", "adapters/**", "apps/**", "vehicles/**"]
exclude_globs = ["**/tests.rs", "**/tests/**"]
context = "code"
allow_in_tests = true
reason = "monotonic counters use wrapping_add(1)"

[[banned_patterns]]
id = "no-second-utc-clock"
pattern = '\bfn utc_at\('
languages = ["rust"]
include_globs = ["crates/**", "adapters/**", "apps/**", "vehicles/**"]
exclude_globs = ["**/tests.rs", "**/tests/**", "crates/sim-spacetime/**", "crates/sim-core/src/rigid_body.rs"]
context = "code"
allow_in_tests = true
reason = "tick-to-time conversion goes through sim_spacetime::SimEpoch::utc_at"

[[banned_patterns]]
id = "no-epoch-constant"
pattern = 'const [A-Z0-9_]*(EPOCH|UTC)[A-Z0-9_]*: f64'
languages = ["rust"]
include_globs = ["crates/**", "adapters/**", "apps/**", "vehicles/**"]
exclude_globs = ["**/tests.rs", "**/tests/**", "crates/sim-spacetime/**", "crates/sim-scenario/src/profile.rs"]
context = "code"
allow_in_tests = true
reason = "scenario start times live in ScenarioProfile::start_utc_unix_s; epochs come from sim_spacetime::SimEpoch"

[[banned_patterns]]
id = "no-second-harmonic-synthesis"
pattern = 'fn\s+[a-z0-9_]*(spherical_harmonic|solid_harmonic|legendre|normalized_vw|cunningham)[a-z0-9_]*\s*[(<]'
languages = ["rust"]
include_globs = ["crates/**", "adapters/**", "apps/**", "vehicles/**"]
exclude_globs = ["**/tests.rs", "**/tests/**"]
context = "code"
allow_in_tests = true
reason = "harmonic synthesis belongs to world-potential, reached through sim-bodies"

[[banned_patterns]]
id = "fields-via-sim-bodies"
pattern = 'world_geomag|world_potential'
languages = ["rust"]
include_globs = ["crates/sim-devices/src/**", "crates/sim-orbital/src/**", "crates/sim-universe/src/**", "crates/sim-core/src/**"]
exclude_globs = ["**/tests.rs", "**/tests/**"]
context = "code"
allow_in_tests = true
reason = "simulated fields come from sim-bodies, not a model crate directly"

[[banned_patterns]]
id = "no-legacy-public-names"
pattern = 'pub\s+(fn|struct|enum|trait|type)\s+[A-Za-z0-9_]*(Gmat|gmat|HaloSeed|target_l2_halo_orbit)'
languages = ["rust"]
include_globs = ["crates/**", "adapters/**", "vehicles/**"]
exclude_globs = []
context = "code"
allow_in_tests = true
reason = "use domain names, not Gmat / HaloSeed / target_l2_halo_orbit"
